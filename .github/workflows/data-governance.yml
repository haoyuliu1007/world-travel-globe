name: Geographic Data Governance & Quality Audit

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: globe-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run non-destructive geographic data audit
        run: node scripts/audit-data.js

      - name: Build non-destructive enrichment layer
        run: node scripts/build-enrichment.js

      - name: Build production dist bundle
        run: node build-dist.js

      - name: Run automated test suite
        run: node --test tests/*.test.js

      - name: Upload governance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geo-governance-reports
          path: |
            globe-app/data/audit-report.json
            globe-app/data/enrichment/atlas-enrichment.json

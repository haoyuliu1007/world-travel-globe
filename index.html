<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="覆盖全球七大洲 137 国/地区、722 座顶级目的地与 5,414 个精准摄影机位的 3D 交互卫星旅行地球仪。" />
  <meta property="og:title" content="World Travel Globe · 全球旅行地理图鉴" />
  <meta property="og:description" content="全球七大洲 137 国/地区、722 座目的地与 5,414 个机位，物候时间轴、全气候指南与双档预算动线。" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23F5F5F7%22 stroke-width=%221.75%22><circle cx=%2212%22 cy=%2212%22 r=%229.5%22/><path d=%22M2.5 12h19M12 2.5a14.5 14.5 0 0 1 0 19M12 2.5a14.5 14.5 0 0 0 0 19%22/></svg>" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>World Travel Globe · 全球旅行地理图鉴</title>
  <link rel="stylesheet" href="vendor/maplibre-gl.css" />
  <link rel="stylesheet" href="css/styles.css?v=36" />
  <link rel="stylesheet" href="css/upgrades.css?v=36" />
  <link rel="stylesheet" href="assets/cosmic-intro/player.css?v=2" />
  <script defer src="assets/cosmic-intro/player.js?v=2"></script>
  <script type="application/ld+json" id="dest-jsonld">{}</script>
</head>
<body>
  <!-- Deep Space Backdrop -->
  <div id="space-backdrop" aria-hidden="true"></div>

  <!-- Edge-to-Edge 3D Globe -->
  <div id="map" role="application" aria-label="全球旅行 3D 交互卫星地球仪"></div>

  <!-- Minimalist Loading Indicator -->
  <div class="globe-loader" id="globe-loader" role="status" aria-live="polite">
    <div class="loader-ring" aria-hidden="true"></div>
    <span class="loader-text" id="loader-text" data-i18n="loaderText">正在载入全球 722 座目的地…</span>
  </div>

  <!-- WebGL Recovery Notice -->
  <div class="webgl-banner is-hidden" id="webgl-recovery-banner" role="alert">
    <span id="webgl-recovery-text" data-i18n="webglRecovery">图形上下文正在恢复，地球将自动重绘…</span>
  </div>

  <!-- Intro Flight Skip Pill -->
  <button class="skip-intro-btn is-hidden" id="skip-intro-btn" type="button" aria-label="跳过入场飞行">
    <span data-i18n="skipIntro">跳过飞入</span>
    <kbd>Esc</kbd>
  </button>

  <section id="cosmic-intro" aria-label="宇宙开场" role="dialog" aria-modal="true" hidden>
    <video id="cosmic-film" muted playsinline preload="none" disablepictureinpicture></video>
    <div class="cosmic-film-controls">
      <button id="cosmic-play" type="button" aria-label="暂停">Ⅱ</button>
      <input id="cosmic-progress" type="range" min="0" max="24" step="0.033333" value="0" aria-label="播放进度">
      <button id="cosmic-skip" type="button"><span>跳过</span> <kbd>Esc</kbd></button>
    </div>
  </section>

  <!-- Top-Left Floating Spatial Command Cluster (Google Earth / Apple Maps Pattern) -->
  <header class="top-dock" id="topbar">
    <div class="search-capsule">
      <button class="capsule-icon-btn" id="sidebar-toggle-btn" type="button" aria-label="展开或收起目的地清单" title="目的地清单">
        <span data-icon="list" data-size="16"></span>
      </button>

      <button class="cmd-trigger" id="open-palette-btn" type="button" aria-label="搜索全球目的地与机位 (Ctrl+K 或 /)">
        <span class="cmd-trigger-icon" data-icon="search" data-size="15"></span>
        <span class="cmd-trigger-text" data-i18n="searchPlaceholderShort">搜索 722 城与 5,414 机位…</span>
        <kbd class="cmd-kbd">⌘K</kbd>
      </button>

      <div class="capsule-sep"></div>

      <button class="capsule-icon-btn" id="filter-popover-btn" type="button" aria-expanded="false" aria-controls="filter-popover" aria-label="主题与气候筛选" title="筛选">
        <span data-icon="sliders" data-size="15"></span>
        <span class="badge-dot is-hidden" id="filter-active-badge">0</span>
      </button>

      <button class="capsule-icon-btn" id="favorites-toggle-btn" type="button" aria-pressed="false" aria-label="仅看收藏目的地" title="收藏">
        <span data-icon="bookmark" data-size="15"></span>
        <span class="fav-dot is-hidden" id="favorites-count-badge">0</span>
      </button>

      <div class="capsule-sep"></div>

      <button class="capsule-icon-btn" id="appearance-btn" type="button" aria-expanded="false" aria-controls="appearance-popover" aria-label="外观与主题色" title="外观与主题色">
        <span id="appearance-mode-icon" data-icon="moon" data-size="15"></span>
        <span class="accent-indicator-dot" id="appearance-accent-dot"></span>
      </button>

      <button class="capsule-lang-btn" id="lang-btn" type="button" aria-expanded="false" aria-controls="lang-popover" aria-label="切换语言" title="切换语言">
        <span data-icon="languages" data-size="14"></span>
        <span class="lang-code-badge mono-num" id="lang-code-badge">简</span>
      </button>
    </div>

    <div class="mode-switch" role="tablist" aria-label="视图模式">
      <button class="mode-btn active" id="mode-map-btn" type="button" role="tab" aria-selected="true" data-i18n="modeMap">地球</button>
      <button class="mode-btn" id="mode-gallery-btn" type="button" role="tab" aria-selected="false" data-i18n="modeGallery">图鉴</button>
      <button class="mode-btn" id="mode-planner-btn" type="button" role="tab" aria-selected="false" data-i18n="modePlanner">规划</button>
      <button class="mode-btn" id="mode-archive-btn" type="button" role="tab" aria-selected="false" data-i18n="modeArchive">档案</button>
    </div>

    <span class="atlas-micro-stat mono-num hide-xs" id="atlas-stats-line">722 城 · 5,414 机位</span>
  </header>

  <!-- Appearance & Theme Color Studio Popover -->
  <section class="studio-popover is-hidden" id="appearance-popover" role="dialog" aria-label="外观与主题色设置">
    <div class="studio-section">
      <div class="popover-label" data-i18n="appearanceTitle">外观与主题色</div>
      <div class="theme-mode-switch" id="theme-mode-switch" data-active="dark" role="group" aria-label="白天或黑夜模式">
        <span class="seg-thumb" aria-hidden="true"></span>
        <button class="seg-btn active" data-mode-val="dark" type="button">
          <span data-icon="moon" data-size="13"></span>
          <span data-i18n="modeNight">黑夜</span>
        </button>
        <button class="seg-btn" data-mode-val="light" type="button">
          <span data-icon="sun" data-size="13"></span>
          <span data-i18n="modeDay">白天</span>
        </button>
      </div>
    </div>

    <div class="studio-section">
      <div class="popover-label" data-i18n="accentPaletteLabel">主题色盘</div>
      <div class="swatch-grid" id="accent-swatch-grid" role="group" aria-label="主题颜色色盘"></div>
      <label class="custom-color-row" for="custom-accent-input">
        <span class="custom-color-label" data-i18n="customColorLabel">自定义色值</span>
        <span class="custom-color-ctrl">
          <span class="custom-color-hex mono-num" id="custom-accent-hex">#E2C07D</span>
          <input type="color" id="custom-accent-input" value="#E2C07D" aria-label="自定义主题色" />
        </span>
      </label>
    </div>
    <div class="studio-section cosmic-options" hidden>
      <button id="cosmic-replay" type="button">重播宇宙开场</button>
      <a id="cosmic-credits" href="assets/cosmic-intro/credits.html" target="_blank" rel="noopener">影像来源</a>
    </div>
  </section>

  <!-- 3-Language Selector Popover -->
  <section class="studio-popover lang-popover is-hidden" id="lang-popover" role="dialog" aria-label="界面语言选择">
    <div class="popover-label" data-i18n="languageTitle">界面语言</div>
    <div class="lang-grid" id="lang-grid" role="listbox" aria-label="支持 3 种语言"></div>
  </section>

  <!-- Filter Popover -->
  <section class="filter-popover is-hidden" id="filter-popover" role="dialog" aria-label="多维条件筛选">
    <div class="popover-section">
      <div class="popover-label" data-i18n="filterTheme">美学主题</div>
      <div class="theme-pills" id="theme-pills" role="group" aria-label="主题筛选">
        <button class="pill-btn active" data-theme="all" type="button" data-i18n="filterAll">全部</button>
        <button class="pill-btn" data-theme="nature" type="button" data-i18n="themeNature">自然奇观</button>
        <button class="pill-btn" data-theme="architecture" type="button" data-i18n="themeArch">城市建筑</button>
      </div>
    </div>

    <div class="popover-section">
      <div class="popover-label" data-i18n="filterWeather">气象与天象</div>
      <div class="weather-pills" id="weather-pills" role="group" aria-label="天气筛选">
        <button class="pill-btn active" data-weather="all" type="button" data-i18n="filterAll">全部</button>
        <button class="pill-btn" data-weather="allWeather" type="button" data-i18n="weatherAllWeather">四季皆美</button>
        <button class="pill-btn" data-weather="sunny" type="button" data-i18n="weatherSunny">晴空星空</button>
        <button class="pill-btn" data-weather="rain" type="button" data-i18n="weatherRain">烟雨云海</button>
        <button class="pill-btn" data-weather="snow" type="button" data-i18n="weatherSnow">雪景蓝冰</button>
        <button class="pill-btn" data-weather="special" type="button" data-i18n="weatherSpecial">极限奇观</button>
      </div>
    </div>

    <div class="popover-footer">
      <span class="popover-hint mono-num" id="popover-match-summary">722 城匹配</span>
      <button class="text-btn" id="popover-reset-btn" type="button" data-i18n="reset">重置</button>
    </div>
  </section>

  <!-- Active Filter Chips (appears subtly below top-dock only when filtering) -->
  <div class="active-chips-bar is-hidden" id="active-filter-chips" aria-live="polite"></div>

  <!-- Left Collapsible Directory Drawer -->
  <aside class="left-sidebar" id="left-sidebar" aria-label="全球目的地清单">
    <div class="sidebar-header">
      <div class="sidebar-title-wrap">
        <span class="sidebar-title" id="sidebar-title">全球目的地</span>
        <span class="sidebar-count mono-num" id="sidebar-count">722</span>
      </div>
      <div class="sidebar-actions">
        <button id="reset-filters-btn" class="text-btn is-hidden" type="button" data-i18n="reset">重置</button>
        <button id="sidebar-collapse-btn" class="icon-btn" type="button" aria-label="收起清单" title="收起">
          <span data-icon="chevronLeft" data-size="15"></span>
        </button>
      </div>
    </div>

    <nav class="sidebar-continents" id="continent-tabs" aria-label="大洲切换"></nav>

    <div class="sidebar-legend">
      <span class="legend-item"><i class="dot dot-gold"></i><span data-i18n="legendAllWeather">四季全天候</span></span>
      <span class="legend-item"><i class="dot dot-ice"></i><span data-i18n="legendSeasonal">季节 / 气象限定</span></span>
    </div>

    <div class="sidebar-list" id="sidebar-list"></div>
  </aside>

  <!-- Bottom-Center Slim 12-Month Phenology Scrubber -->
  <section class="phenology-bar" id="phenology-bar" aria-label="全球物候月份轴">
    <div class="phenology-track" id="phenology-track" role="radiogroup" aria-label="选择月份"></div>
    <span class="phenology-hemi mono-num" id="phenology-hemi-hint">全年</span>
  </section>

  <!-- Bottom-Right Apple/Google Earth Control Cluster -->
  <div class="globe-controls" id="globe-controls" aria-label="底图与视角控制">
    <div class="skin-switcher" role="group" aria-label="地图风格">
      <button class="ctrl-btn active" data-skin="satellite" type="button" data-i18n="skinSatellite">卫星</button>
      <button class="ctrl-btn" data-skin="natgeo" type="button" data-i18n="skinNatgeo">国家地理</button>
      <button class="ctrl-btn" data-skin="physical" type="button" data-i18n="skinPhysical">地形</button>
      <button class="ctrl-btn" data-skin="dark" type="button" data-i18n="skinDark">暗夜</button>
    </div>
    <div class="divider-v"></div>
    <div class="action-switcher">
      <button class="ctrl-icon-btn" id="toggle-labels-btn" type="button" aria-label="底图地名" title="底图地名">
        <span data-icon="layers" data-size="14"></span>
      </button>
      <button class="ctrl-btn" id="toggle-tile-cdn-btn" type="button" title="切换底图线路（标准 / 国内极速）" data-i18n="tileRouteAuto">自动线路</button>
      <button class="ctrl-icon-btn" id="toggle-all-labels-btn" type="button" aria-label="全量城市标签" title="全量标签">
        <span data-icon="tag" data-size="14"></span>
      </button>
      <button class="ctrl-icon-btn active" id="toggle-proj-btn" type="button" aria-label="3D 球体 / 2D 平面" title="3D / 2D">
        <span data-icon="box3d" data-size="14"></span>
      </button>
      <button class="ctrl-icon-btn" id="toggle-spin-btn" type="button" aria-label="地球自转" title="自转">
        <span data-icon="rotateCw" data-size="14"></span>
      </button>
      <button class="ctrl-icon-btn" id="toggle-cluster-btn" type="button" aria-label="空间聚合" title="空间聚合 (Supercluster)">
        <span data-icon="cluster" data-size="14"></span>
      </button>
      <button class="ctrl-icon-btn" id="toggle-weather-layer-btn" type="button" aria-label="全球气象图层" title="全球实时雷达/云图">
        <span data-icon="cloud" data-size="14"></span>
      </button>
      <button class="ctrl-icon-btn" id="toggle-timemachine-btn" type="button" aria-label="地球时光机" title="地球时光机 (NASA GIBS)">
        <span data-icon="history" data-size="14"></span>
      </button>
      <button class="ctrl-icon-btn" id="toggle-footprint-btn" type="button" aria-label="私人足迹图层" title="私人旅行足迹图层">
        <span data-icon="user" data-size="14"></span>
      </button>
      <button class="ctrl-icon-btn" id="toggle-fullscreen-btn" type="button" aria-label="全屏探索模式" title="全屏探索 (F)">
        <span data-icon="maximize" data-size="14"></span>
      </button>
      <button class="ctrl-icon-btn" id="open-diagnostics-btn" type="button" aria-label="系统诊断与配置" title="系统诊断、质量审核与设置">
        <span data-icon="activity" data-size="14"></span>
      </button>
      <button class="ctrl-btn" id="fly-china-btn" type="button" title="中国视角" data-i18n="flyChina">中国</button>
      <button class="ctrl-btn" id="fly-global-btn" type="button" title="全球视角" data-i18n="flyGlobal">全球</button>
      <div class="divider-v hide-xs"></div>
      <button class="ctrl-icon-btn hide-xs" id="zoom-in-btn" type="button" aria-label="放大" title="放大">
        <span data-icon="plus" data-size="14"></span>
      </button>
      <button class="ctrl-icon-btn hide-xs" id="zoom-out-btn" type="button" aria-label="缩小" title="缩小">
        <span data-icon="minus" data-size="14"></span>
      </button>
    </div>
  </div>

  <!-- Sub-spot Floating Pill -->
  <div class="subspot-toast is-hidden" id="subspot-toast">
    <span id="subspot-toast-text"></span>
    <button id="back-to-city-overview" class="text-btn" type="button" data-i18n="panorama">全景</button>
  </div>

  <!-- Right Floating Inspector Sheet / Mobile 3-Stage Bottom Sheet -->
  <aside class="detail-drawer is-hidden" id="detail-drawer" data-sheet-state="half" aria-label="目的地档案">
    <div class="drawer-drag-zone mobile-only" id="drawer-drag-handle" aria-label="拖拽调节抽屉高度">
      <span class="drag-pill"></span>
    </div>

    <div class="drawer-header" id="drawer-header">
      <div class="drawer-nav-row">
        <div class="breadcrumb" id="drawer-breadcrumb"></div>
        <div class="drawer-win-actions">
          <button id="drawer-fav-btn" class="icon-btn" type="button" aria-label="收藏目的地" title="收藏">
            <span data-icon="bookmark" data-size="14"></span>
          </button>
          <button id="share-dest-btn" class="icon-btn" type="button" aria-label="复制直达链接" title="分享链接">
            <span data-icon="share" data-size="14"></span>
          </button>
          <button id="prev-dest-btn" class="icon-btn" type="button" aria-label="上一站" title="上一站">
            <span data-icon="chevronLeft" data-size="15"></span>
          </button>
          <button id="next-dest-btn" class="icon-btn" type="button" aria-label="下一站" title="下一站">
            <span data-icon="chevronRight" data-size="15"></span>
          </button>
          <button id="drawer-expand-btn" class="icon-btn mobile-only" type="button" aria-label="展开或收起" title="切换高度">
            <span data-icon="maximize" data-size="14"></span>
          </button>
          <button id="drawer-close-btn" class="icon-btn" type="button" aria-label="关闭 (Esc)" title="关闭">
            <span data-icon="x" data-size="15"></span>
          </button>
        </div>
      </div>

      <div class="drawer-title-block">
        <div class="drawer-kicker-row">
          <span class="kicker-tag" id="drawer-allweather-badge"></span>
          <span class="kicker-coords mono-num" id="drawer-hero-coords"></span>
        </div>
        <h2 id="drawer-title"></h2>
        <p class="drawer-subtitle" id="drawer-subtitle"></p>
      </div>

      <div class="drawer-meta-line" id="drawer-meta-strip"></div>
      <div class="hero-phenology-ribbon" id="drawer-phenology-ribbon" aria-label="12个月最佳观赏指数"></div>
      <p class="drawer-hero-summary" id="drawer-hero-summary"></p>

      <div class="drawer-tabs" id="drawer-tabs" role="tablist">
        <button class="tab-btn active" data-tab="spots" type="button" role="tab" aria-selected="true">
          <span data-i18n="tabSpots">机位</span> <span class="tab-count mono-num" id="tab-spots-count"></span>
        </button>
        <button class="tab-btn" data-tab="photo" type="button" role="tab" aria-selected="false" data-i18n="tabPhoto">光影</button>
        <button class="tab-btn" data-tab="months" type="button" role="tab" aria-selected="false" data-i18n="tabMonths">物候</button>
        <button class="tab-btn" data-tab="weather" type="button" role="tab" aria-selected="false" data-i18n="tabWeather">气候</button>
        <button class="tab-btn" data-tab="budget" type="button" role="tab" aria-selected="false" data-i18n="tabBudget">预算</button>
        <button class="tab-btn" data-tab="itinerary" type="button" role="tab" aria-selected="false" data-i18n="tabItinerary">动线</button>
      </div>
    </div>

    <div class="drawer-body" id="detail-body"></div>
  </aside>

  <!-- Global Aesthetic Gallery View -->
  <section class="gallery-view is-hidden" id="gallery-view" aria-label="全球地理美学图鉴">
    <div class="gallery-container">
      <div class="gallery-head">
        <div>
          <span class="gallery-kicker" data-i18n="galleryKicker">WORLD ATLAS · 722 DESTINATIONS</span>
          <h2 data-i18n="galleryTitle">全球旅行地理图鉴</h2>
          <p class="gallery-lead" id="gallery-lead" data-i18n="galleryLead">按自然奇观、建筑美学、四季全天候与极限气象索引全球 722 座目的地，点选即飞往 3D 实景坐标。</p>
        </div>
        <button class="gallery-back-btn" id="gallery-back-map-btn" type="button">
          <span data-icon="globe" data-size="14"></span>
          <span data-i18n="backToGlobe">返回地球</span>
        </button>
      </div>

      <div class="gallery-toolbar">
        <div class="gallery-collections" id="gallery-collections" role="tablist">
          <button class="gallery-tab active" data-collection="all" type="button" data-i18n="galAll">全部</button>
          <button class="gallery-tab" data-collection="nature" type="button" data-i18n="themeNature">自然奇观</button>
          <button class="gallery-tab" data-collection="architecture" type="button" data-i18n="themeArch">城市建筑</button>
          <button class="gallery-tab" data-collection="allWeather" type="button" data-i18n="weatherAllWeather">四季皆美</button>
          <button class="gallery-tab" data-collection="special" type="button" data-i18n="weatherSpecial">极限天象</button>
          <button class="gallery-tab" data-collection="favorites" type="button" data-i18n="galFav">收藏</button>
          <button class="gallery-tab" data-collection="index" type="button" data-i18n="galIndex">追美榜</button>
        </div>
        <div class="gallery-count mono-num" id="gallery-count">0</div>
      </div>

      <div class="gallery-grid" id="gallery-grid"></div>
    </div>
  </section>

  <!-- Global Command Palette (Ctrl/Cmd+K or /) -->
  <div class="palette-backdrop is-hidden" id="command-palette" role="dialog" aria-modal="true" aria-label="全局搜索面板">
    <div class="palette-modal">
      <div class="palette-input-row">
        <span class="palette-search-icon" data-icon="search" data-size="16"></span>
        <input
          id="palette-input"
          type="text"
          data-i18n-placeholder="palettePlaceholder"
          placeholder="搜索国家、城市、精准机位或英文 ID（如：京都、冰岛、kerala）…"
          autocomplete="off"
          aria-label="全局搜索"
        />
        <button class="icon-btn is-hidden" id="palette-clear-btn" type="button" aria-label="清空">
          <span data-icon="x" data-size="14"></span>
        </button>
        <kbd class="palette-esc">ESC</kbd>
      </div>
      <div class="palette-results" id="palette-results" role="listbox"></div>
